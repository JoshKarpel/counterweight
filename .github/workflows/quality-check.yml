name: quality-check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test-code:
    name: Test code
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ["3.15"]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PLATFORM: ${{ matrix.platform }}
      PYTHON_VERSION: ${{ matrix.python-version }}
      UV_PYTHON: ${{ matrix.python-version }}
      PYTHONUTF8: 1  # https://peps.python.org/pep-0540/
      COLORTERM: truecolor
      PIP_DISABLE_PIP_VERSION_CHECK: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Just
        uses: jdx/mise-action@v5.1.1

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Make sure we can build the package
        run: uv build

      - name: Test types
        run: uv run mypy

      - name: Test code
        run: uv run pytest -v --cov --durations=20
        timeout-minutes: 5

      - name: Test docs
        run: uv run mkdocs build --clean --strict --verbose
