name: publish-docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  publish-docs:
    name: Publish docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # gh-deploy pushes the built site to the gh-pages branch
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true  # gh-deploy pushes with the checkout's credential

      - name: Install uv
        uses: jdx/mise-action@v5.1.1
        with:
          cache: false  # don't restore a cache into a job that publishes

      - name: Build and deploy docs
        run: uv run mkdocs gh-deploy --clean --strict --verbose --force
