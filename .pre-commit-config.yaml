# Every hook is `local` and runs a tool from the `dev` group through `uv run`, so the hooks, the editor, `just` and CI
# all run the version `uv.lock` holds, under the same cooldown as every other dependency.
# `--frozen` so a hook never re-locks: the `uv-lock` hook is the one that reports a stale lock.
# Vendored files stay byte for byte as their project publishes them.
exclude: ^docs/assets/vendor/
repos:
  - repo: local
    hooks:
      - id: check-added-large-files
        name: check for added large files
        entry: uv run --frozen check-added-large-files
        language: unsupported
      - id: check-case-conflict
        name: check for case conflicts
        entry: uv run --frozen check-case-conflict
        language: unsupported
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: uv run --frozen check-merge-conflict
        language: unsupported
        types: [text]
      - id: check-toml
        name: check toml
        entry: uv run --frozen check-toml
        language: unsupported
        types: [toml]
      - id: check-json
        name: check json
        entry: uv run --frozen check-json
        language: unsupported
        types: [json]
      - id: detect-private-key
        name: detect private key
        entry: uv run --frozen detect-private-key
        language: unsupported
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --frozen end-of-file-fixer
        language: unsupported
        types: [text]
      - id: forbid-new-submodules
        name: forbid new submodules
        entry: uv run --frozen forbid-new-submodules
        language: unsupported
        types: [directory]
      - id: mixed-line-ending
        name: mixed line ending
        entry: uv run --frozen mixed-line-ending
        language: unsupported
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen trailing-whitespace-fixer
        language: unsupported
        types: [text]
        # Text screenshots are exact character grids, trailing blanks included.
        exclude: ^docs/assets/.*\.txt$

  - repo: local
    hooks:
      - id: check-dependabot
        name: Validate Dependabot Config (v2)
        entry: uv run --frozen check-jsonschema --builtin-schema vendor.dependabot
        language: unsupported
        files: ^\.github/dependabot\.(yml|yaml)$
        types: [yaml]
      - id: check-github-workflows
        name: Validate GitHub Workflows
        entry: uv run --frozen check-jsonschema --builtin-schema vendor.github-workflows
        language: unsupported
        files: ^\.github/workflows/[^/]+$
        types: [yaml]
      - id: check-github-actions
        name: Validate GitHub Actions
        entry: uv run --frozen check-jsonschema --builtin-schema vendor.github-actions
        language: unsupported
        files: >
          (?x)^(
            action\.(yml|yaml)|
            \.github/actions/(.+/)?action\.(yml|yaml)
          )$
        types: [yaml]

  - repo: local
    hooks:
      - id: zizmor
        name: zizmor
        entry: uv run --frozen zizmor --no-progress
        language: unsupported
        files: (^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$
        types: [yaml]
        require_serial: true

  - repo: local
    hooks:
      - id: no-plc0415
        name: no PLC0415 (import-not-at-top) suppression
        language: pygrep
        entry: 'PLC0415'
        types: [python]
      - id: format-justfile
        name: format justfile
        entry: just --fmt --unstable
        language: unsupported
        files: ^justfile$
        pass_filenames: false
      - id: generate-utilities
        name: generate utilities
        entry: uv run --frozen python codegen/generate_utilities.py
        language: unsupported
        always_run: true
        pass_filenames: false
      - id: generate-logo
        name: generate logo
        entry: uv run --frozen python codegen/generate_logo.py
        language: unsupported
        files: ^(codegen/(generate_logo\.py|fonts/)|src/counterweight/styles/utilities\.py$|docs/assets/logo/)
        pass_filenames: false
      - id: sync-uv-build
        name: sync uv_build with the pinned uv
        entry: uv run --frozen python codegen/sync_uv_build.py
        language: unsupported
        files: ^(mise\.lock|pyproject\.toml|codegen/sync_uv_build\.py)$
        pass_filenames: false
      - id: generate-screenshots
        name: generate docs screenshots
        entry: uv run --frozen python -m docs.generate_screenshots
        language: unsupported
        files: ^(src/|docs/generate_screenshots\.py$|docs/assets/.*\.(svg|cast)$|uv\.lock$)
        pass_filenames: false

  - repo: local
    hooks:
      # Check before formatting: a fix can leave code the formatter would change.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix
        language: unsupported
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

  # `uv` itself is whichever is on `PATH`, not a package in the lock it checks.
  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock
        entry: uv lock
        language: unsupported
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        pass_filenames: false
