[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "counterweight"
version = "0.1.0"
description = "An experimental TUI framework for Python, inspired by React and Tailwind"
readme = "README.md"
license = "MIT"
authors = [
    { name = "JoshKarpel", email = "josh.karpel@gmail.com" }
]
keywords = [
    "tui",
    "terminal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Typing :: Typed",
]
requires-python = ">=3.15"
dependencies = [
    "more-itertools>=9.1",
    "waxy>=0.7.1",
    "without-cli>=0.0.10",
    "without-logging>=0.0.10",
    "without-streams>=0.0.10",
    "wcwidth>=0.8",
    "markdown-it-py>=4.1",
    "pygments>=2.17",
    "mdit-py-plugins>=0.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4",
    "black==26.3.1",
    "watchfiles>=0.19",
    "pytest<10",
    "pytest-cov>=3",
    "pytest-xdist>=3",
    "pytest-asyncio>=1",
    "pytest-mock>=3",
    "hypothesis>=6.80",
    "mypy>=2.4",
    "mkdocs<2",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.19.0",
    "ruff>=0.15.4",
    "mutmut>=3.8.0",
    "types-pygments>=2.17",
]

[project.scripts]
counterweight = "counterweight.cli:main"

[project.urls]
Homepage = "https://github.com/JoshKarpel/counterweight"
Repository = "https://github.com/JoshKarpel/counterweight"
Documentation = "https://www.counterweight.dev"
"Bug Tracker" = "https://github.com/JoshKarpel/counterweight/issues"

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { waxy = false }  # our own layout engine, which counterweight tracks closely

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-Werror"]
testpaths = ["tests", "src/counterweight", "docs"]

markers = ["slow"]

asyncio_mode = "auto"

# A test stuck in a system call (such as a `tcsetattr` waiting on a pty nobody reads) can't be timed out by asyncio,
# so dump every thread's traceback and exit, rather than hanging silently until CI cancels the job.
faulthandler_timeout = 30
faulthandler_exit_on_timeout = true

[tool.coverage.run]
branch = true
source = ["src/counterweight/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
sort = "-cover"
# Checked only where `--cov` is passed (`just test` with no arguments, and CI), never in `addopts`:
# mutmut runs pytest itself, against a copy of the source that `source` doesn't name and with only some tests per mutant,
# so a gate there would fail mutmut's baseline and count every mutant as killed.
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "assert_never\\(",
    "case _ as unreachable:",
    # Test doubles and guards that fail the test if they ever run.
    "raise AssertionError",
    "pragma: unreachable",
    # Functions a test builds only to compare or inspect, such as handlers whose code `equivalent` compares.
    "pragma: never runs",
]

[tool.mypy]
pretty = true
show_error_codes = true

files = ["."]
exclude = ["site/", "mutants/"]

check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
disallow_any_generics = true

warn_unused_configs = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_redundant_casts = true

ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "I",   # https://beta.ruff.rs/docs/rules/#isort-i
    "F",   # https://beta.ruff.rs/docs/rules/#pyflakes-f
    "E",   # https://beta.ruff.rs/docs/rules/#error-e
    "W",   # https://beta.ruff.rs/docs/rules/#warning-w
    "T20", # https://beta.ruff.rs/docs/rules/#flake8-print-t20
    "PIE", # https://beta.ruff.rs/docs/rules/#flake8-pie-pie
    "PLC", # https://beta.ruff.rs/docs/rules/#convention-plc
    "PLE", # https://beta.ruff.rs/docs/rules/#error-ple
    "PLW", # https://beta.ruff.rs/docs/rules/#warning-plw
    "PTH", # https://beta.ruff.rs/docs/rules/#flake8-use-pathlib-pth
    "PGH", # https://beta.ruff.rs/docs/rules/#pygrep-hooks-pgh
    "RUF", # https://beta.ruff.rs/docs/rules/#ruff-specific-rules-ruf
]

ignore = [
    "E501",  # line length exceeds limit
    "E741",  # ambiguous variable name
    "T201",  # print
    "T203",  # pprint
    "F403",  # star imports, used for utilities
    "F405",  # star imports, used for utilities
]


[tool.ruff.lint.flake8-bugbear]
# Styles are immutable values, so they're safe as dataclass defaults.
extend-immutable-calls = [
    "counterweight.styles.Style",
    "counterweight.styles.CellStyle",
    "counterweight.styles.styles.Style",
    "counterweight.styles.styles.CellStyle",
    "counterweight.styles.utilities.*",
]

[tool.mutmut]
source_paths = ["src"]
also_copy = ["benchmarks/", "docs/", "mkdocs_hooks/"]
pytest_add_cli_args_test_selection = ["tests/"]
# It checks that every public name in the utilities module is documented, and mutmut adds names to it.
pytest_add_cli_args = ["--ignore=tests/test_mkdocs_utility_tables.py"]
# The type checker proves these lines unreachable, so every mutant of them survives.
do_not_mutate_patterns = ["assert_never\\("]
