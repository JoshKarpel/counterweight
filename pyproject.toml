[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[project]
name = "counterweight"
version = "0.1.1"
description = "An experimental TUI framework for Python, inspired by React and Tailwind"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "JoshKarpel", email = "josh.karpel@gmail.com" }
]
keywords = [
    "tui",
    "terminal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Typing :: Typed",
]
requires-python = ">=3.15"
dependencies = [
    "more-itertools>=9.1",
    "waxy>=0.7.1",
    "without-cli>=0.0.10",
    "without-logging>=0.0.10",
    "without-streams>=0.0.10",
    "wcwidth>=0.8",
    "markdown-it-py>=4.1",
    "pygments>=2.17",
    "mdit-py-plugins>=0.5",
    "pyghostty>=0.1.3",
    "pillow>=13",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4",
    "pre-commit-hooks>=6.0.0",
    "check-jsonschema>=0.38.0",
    "zizmor>=1.30.0",
    "watchfiles>=0.19",
    "pytest>=9.0",
    "pytest-cov>=3",
    "pytest-xdist>=3",
    "pytest-asyncio>=1",
    "pytest-mock>=3",
    "hypothesis>=6.80",
    "mypy>=2.4",
    "mkdocs<2",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.19.0",
    "ruff>=0.16.10",
    "mutmut>=3.8.0",
    "types-pygments>=2.17",
    "coverage-conditional-plugin>=0.9.0",
    "fonttools>=4.40",
]

[project.scripts]
counterweight = "counterweight._cli:main"

[project.urls]
Homepage = "https://github.com/JoshKarpel/counterweight"
Repository = "https://github.com/JoshKarpel/counterweight"
Documentation = "https://www.counterweight.dev"
"Bug Tracker" = "https://github.com/JoshKarpel/counterweight/issues"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
waxy = false  # our own layout engine, which counterweight tracks closely
certifi = false  # takes 2026.10.23 inside the cooldown; drop after 2026-10-30, once it ages past it
virtualenv = false  # takes 21.14.13 inside the cooldown; drop after 2026-10-30, once it ages past it
filelock = false  # takes 4.2.4 inside the cooldown, for the advisories fixed in 4.2.1; drop after 2026-10-26, once it ages past it

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-Werror"]
testpaths = ["tests", "src/counterweight", "docs"]

markers = ["slow"]

asyncio_mode = "auto"

# A test stuck in a system call (such as a `tcsetattr` waiting on a pty nobody reads) can't be timed out by asyncio,
# so dump every thread's traceback and exit, rather than hanging silently until CI cancels the job.
faulthandler_timeout = 30
faulthandler_exit_on_timeout = true

[tool.coverage.run]
branch = true
source = ["src/counterweight/", "tests/"]
# Measures the Python programs tests run, such as `counterweight examples run` on a pseudo-terminal.
patch = ["subprocess"]
plugins = ["coverage_conditional_plugin"]

# Each marker is ignored wherever its condition holds, so a line only one platform runs stays measured there.
[tool.coverage.coverage_conditional_plugin.rules]
"pragma: linux only" = "sys_platform != 'linux'"
"pragma: macos only" = "sys_platform != 'darwin'"

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
sort = "-cover"
# Checked only where `--cov` is passed (`just test` with no arguments, and CI), never in `addopts`:
# mutmut runs pytest itself, against a copy of the source that `source` doesn't name and with only some tests per mutant,
# so a gate there would fail mutmut's baseline and count every mutant as killed.
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
    # An example's entry point, which the suite runs through the examples' CLI instead.
    "if __name__ == .__main__.:",
    "@overload",
    "assert_never\\(",
    "case _ as unreachable:",
    # Test doubles and guards that fail the test if they ever run.
    "raise AssertionError",
    "pragma: unreachable",
    # Functions a test builds only to compare or inspect, such as handlers whose code `equivalent` compares.
    "pragma: never runs",
]

[tool.mypy]
pretty = true
show_error_codes = true

files = ["."]
exclude = ["site/", "mutants/"]

check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
disallow_any_generics = true

warn_unused_configs = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_redundant_casts = true

ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A",     # https://docs.astral.sh/ruff/rules/#flake8-builtins-a
    "ASYNC", # https://docs.astral.sh/ruff/rules/#flake8-async-async
    "B",     # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "BLE",   # https://docs.astral.sh/ruff/rules/#flake8-blind-except-ble
    "C4",    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "D",     # https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "DTZ",   # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
    "E",     # https://docs.astral.sh/ruff/rules/#error-e
    "F",     # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "FLY",   # https://docs.astral.sh/ruff/rules/#flynt-fly
    "FURB",  # https://docs.astral.sh/ruff/rules/#refurb-furb
    "G",     # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
    "I",     # https://docs.astral.sh/ruff/rules/#isort-i
    "ICN",   # https://docs.astral.sh/ruff/rules/#flake8-import-conventions-icn
    "LOG",   # https://docs.astral.sh/ruff/rules/#flake8-logging-log
    "N",     # https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "PERF",  # https://docs.astral.sh/ruff/rules/#perflint-perf
    "PGH",   # https://docs.astral.sh/ruff/rules/#pygrep-hooks-pgh
    "PIE",   # https://docs.astral.sh/ruff/rules/#flake8-pie-pie
    "PLC",   # https://docs.astral.sh/ruff/rules/#convention-plc
    "PLE",   # https://docs.astral.sh/ruff/rules/#error-ple
    "PLW",   # https://docs.astral.sh/ruff/rules/#warning-plw
    "PT",    # https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
    "PTH",   # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
    "PYI",   # https://docs.astral.sh/ruff/rules/#flake8-pyi-pyi
    "RET",   # https://docs.astral.sh/ruff/rules/#flake8-return-ret
    "RSE",   # https://docs.astral.sh/ruff/rules/#flake8-raise-rse
    "RUF",   # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "S307",  # https://docs.astral.sh/ruff/rules/suspicious-eval-usage/
    "SIM",   # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
    "SLF",   # https://docs.astral.sh/ruff/rules/#flake8-self-slf
    "T10",   # https://docs.astral.sh/ruff/rules/#flake8-debugger-t10
    "T20",   # https://docs.astral.sh/ruff/rules/#flake8-print-t20
    "TID",   # https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
    "UP",    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "W",     # https://docs.astral.sh/ruff/rules/#warning-w
]

ignore = [
    "E501",  # line length: formatter owns this
    "E741",  # ambiguous variable name
    "T201",  # print
    "T203",  # pprint
    "F403",  # star imports, used for utilities
    "F405",  # star imports, used for utilities
    "N818",  # exception names are deliberately descriptive, not Error-suffixed
    "G004",  # logging-f-string: f-strings in log calls are allowed
    "FLY002", # static-join-to-f-string: joined rows lay out an expected screen as a grid
    # pydocstyle: enforce well-formed docstrings, but don't mandate their presence.
    # The google convention below already leaves mood alone (D401).
    "D1",    # undocumented-*: a presence check rewards padding
    "D205",  # would force a single-physical-line summary; summary sentences wrap naturally over a few lines
    "D212",  # the summary starts on the line after the opening quotes
]

allowed-confusables = ["╱"]  # the logo's line, a box-drawing character

[tool.ruff.lint.per-file-ignores]
"src/counterweight/examples/**" = [
    "E402",  # each example's scenes, with the imports only they use, come after its code, so a copy can leave them out
    "D415",  # the first line of an example's docstring is its title, which the catalog shows without a period
]

[tool.ruff.lint.pydocstyle]
convention = "google"  # mkdocstrings' default docstring style

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-bugbear]
# Styles and clocks are immutable values, so they're safe as defaults.
extend-immutable-calls = [
    "counterweight.clock.SystemClock",
    "counterweight.styles.Style",
    "counterweight.styles.CellStyle",
    "counterweight.styles._styles.Style",
    "counterweight.styles._styles.CellStyle",
    "counterweight.styles.utilities.*",
    "counterweight.commands.CommandOutputStyles",
    "counterweight.markdown.MarkdownStyles",
    "counterweight.widgets.ScrollAreaStyles",
    "counterweight.widgets.TerminalStyles",
    "counterweight.widgets.TextFieldStyles",
]

[tool.ruff.lint.flake8-builtins]
ignorelist = [
    "hex",   # `Color.from_hex`'s public keyword argument
    "next",  # pairs with `previous` in reconciliation: the element or node replacing the previous one
]

[tool.mutmut]
source_paths = ["src"]
also_copy = ["benchmarks/", "docs/", "mkdocs_hooks/"]
pytest_add_cli_args_test_selection = ["tests/"]
# It checks that every public name in the utilities module is documented, and mutmut adds names to it.
pytest_add_cli_args = ["--ignore=tests/test_mkdocs_utility_tables.py"]
# The type checker proves these lines unreachable, so every mutant of them survives.
do_not_mutate_patterns = ["assert_never\\("]
# A mutant in an example tests nothing about the library.
do_not_mutate = ["src/counterweight/examples/*"]
